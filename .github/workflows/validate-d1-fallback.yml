name: Validate D1 outage fallback

on:
  push:
    branches: [fix/d1-outage-fallback]

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          rm -rf node_modules package-lock.json
          npm install
      - run: npm run build
        env:
          PUBLIC_APP_NAME: Sehyo
