name: Apply Fallow cleanup

on:
  push:
    branches:
      - cleanup/fallow-high-confidence

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove unused dependencies
        run: npm uninstall @radix-ui/react-slot class-variance-authority lucide-react vite-plugin-pwa workbox-window
      - name: Validate
        run: |
          npm run check
          npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fallow-cleanup.yml
          git add package.json package-lock.json
          git commit -m "chore: remove unused dependencies"
          git push origin HEAD:cleanup/fallow-high-confidence
