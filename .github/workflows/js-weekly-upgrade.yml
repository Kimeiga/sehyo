name: Apply JS Weekly Vite security update

on:
  push:
    branches:
      - chore/js-weekly-vite-security

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update Vite
        run: npm install --save-dev 'vite@^7.3.5'
      - name: Validate
        run: |
          npm run check
          npm run build
      - name: Commit generated dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/js-weekly-upgrade.yml
          git add package.json package-lock.json
          git commit -m "fix: update Vite past dev-server advisories"
          git push origin HEAD:chore/js-weekly-vite-security
