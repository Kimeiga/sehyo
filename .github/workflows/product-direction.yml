name: Product direction review

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/product-direction*'
      - 'package*.json'
      - '*config*'
      - '.github/workflows/product-direction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-direction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Matches the existing deploy's fresh dependency resolution, without
      # deleting or rewriting the repository's lockfile. No deployment secrets.
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Compile changed components and check preview boundaries
        run: node --test tests/product-direction.test.mjs
      - name: Production build
        run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the local application
        run: |
          mkdir -p .artifacts/product-direction
          npm run dev -- --host 127.0.0.1 --port 4173 > .artifacts/product-direction/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/prototype/personality > /dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then cat .artifacts/product-direction/server.log; exit 1; fi
          node tests/product-direction.e2e.mjs
      - name: Upload review screenshots and local server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-direction-review
          path: .artifacts/product-direction
          if-no-files-found: ignore

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock=false
      - run: npm run check
