<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f2ec" />
  <title>Sehyo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f2ec;
      color: #171714;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.9), transparent 42rem),
        #f4f2ec;
    }
    main {
      width: min(100%, 560px);
      border-top: 1px solid #bbb8ae;
      border-bottom: 1px solid #bbb8ae;
      padding: 26px 0 24px;
    }
    .wordmark {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 54px;
      font-size: 13px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #c7a15a;
      box-shadow: 0 0 0 4px rgba(199,161,90,.12);
    }
    h1 {
      margin: 0;
      max-width: 12ch;
      font-family: ui-serif, Georgia, serif;
      font-size: clamp(36px, 9vw, 64px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.035em;
    }
    p {
      margin: 22px 0 0;
      max-width: 46ch;
      color: #66635b;
      font-size: 15px;
      line-height: 1.55;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
      min-height: 36px;
    }
    button {
      appearance: none;
      border: 1px solid #aaa79e;
      border-radius: 999px;
      padding: 9px 14px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: rgba(0,0,0,.04); }
    .status {
      color: #77736b;
      font-size: 12px;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">
      <span>Sehyo</span>
      <span class="dot" aria-hidden="true"></span>
    </div>
    <h1 id="heading">Connecting to the live timeline.</h1>
    <p id="message">This page stays available even when the live service is temporarily over capacity.</p>
    <div class="actions">
      <button id="retry" type="button" hidden>Try live Sehyo</button>
      <span id="status" class="status">Checking service…</span>
    </div>
  </main>
  <script>
    const heading = document.getElementById('heading');
    const message = document.getElementById('message');
    const retry = document.getElementById('retry');
    const status = document.getElementById('status');

    async function openLive() {
      retry.hidden = true;
      status.textContent = 'Checking service…';
      try {
        const response = await fetch('/api/health', {
          cache: 'no-store',
          credentials: 'same-origin',
          signal: AbortSignal.timeout(3500)
        });
        if (!response.ok) throw new Error('live service unavailable');
        status.textContent = 'Live service available';
        const target = '/live' + window.location.search + window.location.hash;
        window.location.replace(target);
      } catch {
        heading.textContent = 'The live timeline is temporarily unavailable.';
        message.textContent = 'Sehyo itself is still here. The live feed and posting features will return when the service can accept requests again.';
        status.textContent = 'Fallback mode';
        retry.hidden = false;
      }
    }

    retry.addEventListener('click', openLive);
    openLive();
  </script>
</body>
</html>
